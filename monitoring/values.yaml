# values.yaml — Configuration Helm du stack Prometheus/Grafana
# Utilisé pour installer le monitoring sur Minikube
#
# Commande d'installation :
# helm install prometheus-stack prometheus-community/kube-prometheus-stack \
#   --namespace monitoring \
#   --create-namespace \
#   -f monitoring/values.yaml

grafana:
  # Mot de passe admin Grafana (changer en production !)
  adminPassword: admin123

  # Expose Grafana en NodePort pour accès externe depuis Minikube
  service:
    type: NodePort
    nodePort: 32000

  # Dashboards préconfigurés à importer automatiquement
  # IDs trouvés sur grafana.com/dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: Portfolio
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/default

prometheus:
  prometheusSpec:
    # Surveille TOUS les ServiceMonitors du cluster
    # (pas seulement ceux installés par Helm)
    serviceMonitorSelectorNilUsesHelmValues: false

    # Rétention des données : 7 jours
    retention: 7d

    # Ressources allouées à Prometheus
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 800Mi
        cpu: 500m

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m

# node-exporter : métriques CPU/RAM/disque du serveur
nodeExporter:
  enabled: true

# kube-state-metrics : métriques des objets Kubernetes
kubeStateMetrics:
  enabled: true
