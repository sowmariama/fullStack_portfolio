services:

  # Backend Express
  backend:
    build: ./portfolio/04-express-mongodb
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=5000
    restart: unless-stopped
    networks:
      - portfolio-network

  # Frontend React
  frontend:
    build: ./portfolio/03-react
    container_name: portfolio-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - portfolio-network

# Réseau
networks:
  portfolio-network:
    driver: bridge
